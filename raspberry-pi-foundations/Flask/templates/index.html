<!DOCTYPE html>
<html>
<head>
    <title>Control</title>
</head>
<body>
<h1>Control Panel</h1>

<h2>Sound</h2>
<form method="POST" action="/control">
    <input type="hidden" name="led" value="buzzer">
    <button name="action" value="sound">Play Sound</button>
    <button name="action" value="off">Stop Sound</button>
</form>

<h2>KeyBoard</h2>
<p>
    <a href="/music">
        <button type="button">Keyboard</button>
    </a>
</p>

<h2>LED</h2>
<p>
    <a href="/leds">
        <button type="button">Go to LED Controls</button>
    </a>
</p>
</body>
</html>
