<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music - Raspberry Pi Piano</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f4f4f9;
            padding-top: 50px;
        }
        .piano-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 30px;
        }
        .key {
            width: 70px;
            height: 140px;
            background: white;
            border: 2px solid #333;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            padding-bottom: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            font-weight: bold;
            font-size: 20px;
            transition: background-color 0.1s, transform 0.1s;
        }
        .key.active {
            background-color: #4CAF50;
            color: white;
            transform: translateY(4px);
        }
        .key span {
            font-size: 12px;
            color: #666;
            margin-top: 5px;
        }
        .key.active span {
            color: #eee;
        }
        .btn {
            padding: 7px 12px;
            font-size: 0.85rem;
            font-weight: 400;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.15s, transform 0.1s;
        }
        .btn-secondary {
            background-color: #0f172a;
            color: white;
            text-decoration: none;
            display: inline-block;
            text-align: center;
            padding: 10px 20px;
        }
        .btn-secondary:hover { background-color: #1e293b; }
        .footer {
            margin-top: 40px;
            padding-top: 15px;
            border-top: 1px solid #e2e8f0;
        }
    </style>
</head>
<body>

    <h1>Raspberry Pi Piano</h1>
    <p>Press keys <strong>S, D, F, G, H, J, K, L</strong> on your keyboard to play tones and light up LEDs!</p>

    <div class="piano-container">
        <div class="key" id="key-S">S <span>LED 1 (C4)</span></div>
        <div class="key" id="key-D">D <span>LED 2 (D4)</span></div>
        <div class="key" id="key-F">F <span>LED 3 (E4)</span></div>
        <div class="key" id="key-G">G <span>LED 4 (F4)</span></div>
        <div class="key" id="key-H">H <span>LED 5 (G4)</span></div>
        <div class="key" id="key-J">J <span>LED 6 (A4)</span></div>
        <div class="key" id="key-K">K <span>LED 7 (B4)</span></div>
        <div class="key" id="key-L">L <span>LED 8 (C5)</span></div>
    </div>
    
    <script>
        const validKeys = ['s', 'd', 'f', 'g', 'h', 'j', 'k', 'l'];

        window.addEventListener('keydown', (event) => {
            const upperKey = event.key.toUpperCase();
            
            // Check if valid key and prevent holding down triggering multiple requests
            if (!validKeys.includes(event.key.toLowerCase())) return;

            const keyElement = document.getElementById(`key-${upperKey}`);
            if (keyElement) {
                keyElement.classList.add('active');
            }

            // Send an HTTP POST request to the Python backend
            fetch('/music', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ key: upperKey })
            })
            .then(response => response.json())
            .then(data => console.log('Server response:', data))
            .catch(error => console.error('Error:', error));
        });

        window.addEventListener('keyup', (event) => {
            const upperKey = event.key.toUpperCase();
            const keyElement = document.getElementById(`key-${upperKey}`);
            if (keyElement) {
                keyElement.classList.remove('active');
            }
        });
    </script>    
    
    <div class="footer">
        <a href="/" class="btn btn-secondary">Back to Control Panel</a>
    </div>
</body>
</html>
